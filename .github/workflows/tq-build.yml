## TopQuadrant build of the dp-* release branches, against the patched Jena in TQ Nexus.

name: TQ build

on:
  push:
    branches: ['dp-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build with Maven
        run: mvn -B -s .github/maven-settings.xml -Dmaven.javadoc.skip=true install
        env:
          TB_NEXUS_USER: dependabot-tbs-readonly
          TB_NEXUS_PASSWORD: ${{ secrets.NEXUS_TBS_READONLY_PASSWORD }}
